<style>
  :root{
    /* Apple system light · frosted glass on system gray */
    --bg-grad: linear-gradient(180deg, #F5F5F7 0%, #F2F2F7 55%, #EEF1F6 100%);
    --glass: rgba(255,255,255,.72);
    --glass-strong: rgba(255,255,255,.82);
    --glass-soft: rgba(255,255,255,.55);
    --glass-dark: rgba(29,29,31,.88);
    --hairline: rgba(0,0,0,.06);
    --hairline-strong: rgba(0,0,0,.10);
    --border: rgba(0,0,0,.08);
    --border-strong: rgba(0,0,0,.12);
    --text: #1D1D1F;
    --muted: #86868B;
    --faint: #AEAEB2;
    --primary: #007AFF;
    --primary-soft: rgba(0,122,255,.12);
    --primary-dark: #0071E3;
    --primary-grad: linear-gradient(135deg,#007AFF,#5AC8FA);
    --ok: #34C759; --ok-soft: rgba(52,199,89,.14);
    --warn: #FF9F0A; --warn-soft: rgba(255,159,10,.14);
    --err: #FF3B30; --err-soft: rgba(255,59,48,.12);
    --radius: 16px; --radius-sm: 12px; --radius-lg: 18px;
    --shadow: 0 2px 12px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.04);
    --shadow-float: 0 8px 28px rgba(0,0,0,.08);
    --blur: blur(20px) saturate(140%);
    --blur-strong: blur(28px) saturate(150%);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background: var(--bg-grad);
    background-attachment: fixed;
    color:var(--text); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 50% at 12% 18%, rgba(200,210,230,.35), transparent 55%),
      radial-gradient(ellipse 60% 45% at 88% 78%, rgba(190,205,225,.28), transparent 50%),
      radial-gradient(ellipse 45% 35% at 55% 8%, rgba(220,228,240,.4), transparent 45%);
  }
  button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input{font-family:inherit; font-size:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18); border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.28);}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{display:flex; flex-direction:column; height:100vh;}

  header{
    display:flex; align-items:center; gap:10px;
    padding:0 16px; height:48px; flex:0 0 auto;
    background:var(--glass);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--hairline);
    box-shadow:none;
  }
  .logo{
    width:30px; height:30px; border-radius:9px; flex:0 0 auto;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,90,200,.28);
    background:#007AFF;
  }
  .logo img{width:100%; height:100%; display:block; object-fit:cover;}
  .brand{display:flex; flex-direction:column; line-height:1.2;}
  .brand b{font-size:14.5px; font-weight:650; letter-spacing:-.01em;}
  .brand span{font-size:11px; color:var(--faint);}
  .spacer{flex:1;}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 10px; border-radius:999px; font-size:11.5px;
    background:var(--ok-soft); color:var(--ok); font-weight:550;
    border:1px solid rgba(61,154,106,.22);
    backdrop-filter:blur(8px);
  }
  .pill i{width:6px; height:6px; border-radius:50%; background:currentColor; display:block;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    padding:6px 12px; border-radius:var(--radius-sm);
    border:1px solid var(--hairline-strong);
    background:var(--glass-strong);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    color:var(--text); font-weight:550; transition:.15s;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .btn:hover{background:rgba(255,255,255,.72); border-color:rgba(255,255,255,.8);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{
    background:var(--primary-grad); border-color:transparent; color:#fff;
    box-shadow:0 4px 14px rgba(0,122,255,.28);
  }
  .btn.primary:hover{filter:brightness(1.05); background:var(--primary-grad);}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--muted); box-shadow:none;}
  .btn.ghost:hover{background:rgba(255,255,255,.35); color:var(--text);}
  .btn.danger{color:var(--err); border-color:rgba(209,74,66,.28); background:rgba(255,255,255,.5);}
  .btn.danger:hover{background:var(--err-soft);}
  .btn.warn-outline{color:var(--warn); border-color:rgba(192,138,46,.35); background:rgba(255,255,255,.5);}
  .btn.warn-outline:hover{background:var(--warn-soft);}
  .btn:disabled{opacity:.48; cursor:not-allowed; transform:none; box-shadow:none;}
  .btn.sm{padding:4px 8px; font-size:12px;}
  .btn.big{padding:8px 18px; font-size:13px; font-weight:600; border-radius:12px;}

  main{display:flex; flex:1; min-height:0; position:relative;}

  .side-foot{
    display:flex; gap:6px; align-items:center;
    padding:8px 10px; border-top:1px solid var(--hairline); flex:0 0 auto;
  }
  .side-add{
    flex:1; width:100%;
    display:inline-flex; align-items:center; justify-content:center; gap:4px;
  }
  .side-add-icon{font-size:14px; line-height:1;}
  .side-toggle{
    flex:0 0 auto; width:28px; height:28px; border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--muted); border:1px solid transparent;
    transition:.14s;
  }
  .side-toggle:hover{
    color:var(--text); background:rgba(0,0,0,.04);
    border-color:var(--hairline);
  }
  .side-toggle svg{width:16px; height:16px; display:block;}
  .side-toggle .ico-expand{display:none;}
  .app.side-collapsed .side-toggle .ico-collapse{display:none;}
  .app.side-collapsed .side-toggle .ico-expand{display:block;}

  .side{
    width:300px; flex:0 0 auto; display:flex; flex-direction:column;
    background:var(--glass);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border-right:1px solid var(--hairline); min-height:0;
    transition:width .18s ease;
    overflow:hidden;
  }
  .side-head{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px 6px; flex:0 0 auto;
  }
  .side-head h2{font-size:13px; font-weight:650; letter-spacing:.2px;}
  .count{
    font-size:11.5px; color:var(--faint);
    background:rgba(255,255,255,.4);
    padding:2px 8px; border-radius:999px;
    border:1px solid var(--hairline);
  }
  .repo-list{flex:1; overflow-y:auto; padding:0 8px 8px; min-height:0;}
  .repo{
    display:flex; gap:8px; align-items:flex-start;
    padding:8px 10px; border-radius:12px; border:1px solid transparent;
    cursor:pointer; margin-bottom:2px; transition:.13s; position:relative;
  }
  .repo:hover{background:rgba(255,255,255,.35);}
  .repo.active{
    background:rgba(255,255,255,.55);
    border-color:var(--hairline-strong);
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .repo-del{
    flex:0 0 auto; width:24px; height:24px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color:var(--faint); font-size:13px; opacity:0; transition:.14s;
    margin-top:1px;
  }
  .repo:hover .repo-del{opacity:1;}
  .repo-del:hover{background:var(--err-soft); color:var(--err);}

  /* Narrow rail when collapsed — no floating overlay arrow */
  .app.side-collapsed .side{
    width:44px; min-width:44px; overflow:hidden;
  }
  .app.side-collapsed .side-head{
    justify-content:center; padding:10px 6px 8px;
  }
  .app.side-collapsed .side-head h2,
  .app.side-collapsed .side-head .count,
  .app.side-collapsed .side-head .spacer{display:none;}
  .app.side-collapsed .repo-list{visibility:hidden; opacity:0; pointer-events:none; height:0; padding:0; overflow:hidden; flex:0;}
  .app.side-collapsed .side-foot{
    padding:8px 6px; justify-content:center; margin-top:auto;
  }
  .app.side-collapsed .side-add{
    padding:8px 0; min-width:0;
  }
  .app.side-collapsed .side-add-label{display:none;}
  .repo-main{flex:1; min-width:0;}
  .repo-name{
    font-weight:600; font-size:13px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px;
  }
  .repo-path{
    font-size:11px; color:var(--faint); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; margin-top:1px;
    font-family:Consolas,"Cascadia Mono",monospace;
  }
  .repo-meta{display:flex; gap:4px; align-items:center; margin-top:4px; flex-wrap:wrap;}
  .tag{
    font-size:11px; padding:2px 7px; border-radius:6px;
    background:rgba(255,255,255,.4); color:var(--muted);
    font-family:Consolas,"Cascadia Mono",monospace;
    border:1px solid var(--hairline);
  }
  .tag.gh{background:rgba(0,122,255,.10); color:#0071E3; border-color:rgba(0,122,255,.22);}
  .tag.gl{background:rgba(230,140,80,.14); color:#b4622a; border-color:rgba(230,140,80,.25);}
  .tag.risk{background:var(--warn-soft); color:var(--warn); font-weight:600; border-color:rgba(192,138,46,.3);}
  .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .dot.on{background:#3dba7a;} .dot.off{background:#e06158;} .dot.unk{background:#c3b8d0;}
  .empty{
    text-align:center; color:var(--faint); font-size:13px;
    padding:40px 20px; line-height:1.7;
  }

  /* .content layout overridden below (push-first shell) */
  .card{
    background:var(--glass-strong);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--hairline);
    border-radius:var(--radius); box-shadow:var(--shadow);
    margin-bottom:8px; overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; gap:8px;
    padding:8px 12px; border-bottom:1px solid var(--hairline);
  }
  .card-head h3{font-size:13px; font-weight:650;}
  .card-head .spacer{flex:1;}
  .dirtyhint{font-size:11.5px; color:var(--warn); font-weight:600; padding:2px 8px; border-radius:999px; background:var(--warn-soft); border:1px solid rgba(192,138,46,.28);}
  .card-body{padding:12px;}
  .card-cap{font-size:11.5px; color:var(--faint); margin-top:6px; line-height:1.35;}

  .tabs{
    display:inline-flex; gap:3px; padding:3px;
    background:rgba(255,255,255,.28);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--hairline);
    border-radius:12px; margin-bottom:8px;
  }
  .tab{
    padding:5px 14px; border-radius:9px; font-size:12.5px; font-weight:600;
    color:var(--muted); transition:.14s;
  }
  .tab:hover{color:var(--text);}
  .tab.on{
    background:rgba(255,255,255,.72); color:var(--text);
    box-shadow:0 1px 4px rgba(0,0,0,.06);
  }

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}
  .field{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px; color:var(--muted); font-weight:550;}
  .field label .req{color:var(--err); margin-left:2px;}
  .field label .hint{color:var(--faint); font-weight:400; margin-left:5px; font-size:11.5px;}
  .input{
    width:100%; padding:7px 10px; border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);
    background:rgba(255,255,255,.55); color:var(--text);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:.14s; outline:none;
  }
  .input:hover{border-color:rgba(100,80,140,.32); background:rgba(255,255,255,.7);}
  .input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(0,122,255,.2);
    background:rgba(255,255,255,.85);
  }
  .input.mono{font-family:Consolas,"Cascadia Mono",monospace; font-size:12.5px;}
  .row{display:flex; gap:8px;}
  .row .input{flex:1;}

  .status-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:0;}
  .st-tile{
    border:1px solid var(--hairline); border-radius:10px; padding:8px 10px;
    background:rgba(255,255,255,.38);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    min-width:0;
  }
  .st-tile .k{font-size:11px; color:var(--muted); font-weight:600; margin-bottom:3px;}
  .st-tile .v{font-size:12.5px; font-weight:650; color:var(--text); line-height:1.25;}
  .st-tile .s{font-size:11px; color:var(--faint); margin-top:2px;
    font-family:Consolas,"Cascadia Mono",monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .st-tile.warn{background:var(--warn-soft); border-color:rgba(192,138,46,.3);}
  .st-tile.ok{background:var(--ok-soft); border-color:rgba(61,154,106,.28);}
  .st-tile.err{background:var(--err-soft); border-color:rgba(209,74,66,.28);}

  .validate-strip{
    display:flex; align-items:center; gap:6px; margin-top:8px;
    font-size:12px; padding:6px 10px; border-radius:var(--radius-sm);
    background:rgba(255,255,255,.35); color:var(--muted);
    border:1px solid var(--hairline);
  }
  .validate-strip.ok{background:var(--ok-soft); color:var(--ok); border-color:rgba(61,154,106,.25);}
  .validate-strip.warn{background:var(--warn-soft); color:var(--warn); border-color:rgba(192,138,46,.28);}
  .validate-strip.err{background:var(--err-soft); color:var(--err); border-color:rgba(209,74,66,.25);}

  .target-list{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .tg-card{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:12px;
    border:1.5px solid var(--hairline-strong);
    background:rgba(255,255,255,.4);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    cursor:pointer; transition:.14s; user-select:none;
  }
  .tg-card:hover{border-color:rgba(255,255,255,.8); background:rgba(255,255,255,.55);}
  .tg-card.on{
    border-color:rgba(0,122,255,.45); background:var(--primary-soft);
    box-shadow:0 0 0 3px rgba(0,122,255,.12);
  }
  .tg-card.warn{border-color:rgba(192,138,46,.45);}
  .tg-card.warn.on{background:rgba(255,248,230,.7);}
  .tg-body{flex:1; min-width:0;}
  .tg-body b{display:block; font-size:13px; font-weight:650;}
  .tg-body span{display:block; font-size:11.5px; color:var(--muted); margin-top:2px;
    font-family:Consolas,"Cascadia Mono",monospace;}
  .sw{
    position:relative; width:38px; height:22px; border-radius:999px;
    background:rgba(0,0,0,.18); flex:0 0 auto; transition:.18s;
  }
  .tg-card.on .sw{background:var(--primary);}
  .sw::after{
    content:""; position:absolute; top:2px; left:2px; width:18px; height:18px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.15);
    transition:.18s;
  }
  .tg-card.on .sw::after{left:18px;}

  .summary{
    margin-top:8px; padding:7px 10px; border-radius:10px;
    background:rgba(255,255,255,.4);
    border:1px solid var(--hairline);
    font-size:12.5px; color:var(--text); font-weight:550; line-height:1.35;
    backdrop-filter:blur(8px);
  }
  .summary .muted{color:var(--muted); font-weight:500;}
  .gate-note{
    margin-top:6px; font-size:12px; color:var(--muted); line-height:1.4;
    padding:6px 10px; border-radius:10px;
    background:rgba(255,255,255,.35); border:1px solid var(--hairline);
  }
  .gate-note.warn{background:var(--warn-soft); color:var(--warn); border-color:rgba(192,138,46,.28);}
  .gate-note.err{background:var(--err-soft); color:var(--err); border-color:rgba(209,74,66,.25);}
  .gate-note.ok{background:var(--ok-soft); color:var(--ok); border-color:rgba(61,154,106,.25);}

  .opt-row{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:12.5px; color:var(--muted);}
  .opt-row input{width:14px; height:14px; accent-color:var(--primary);}

  .actions{display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); flex-wrap:nowrap;}
  .actions .spacer{flex:1; min-width:6px;}
  .pull-row{display:flex; gap:8px; flex-wrap:wrap;}
  .pull-note{
    font-size:11.5px; color:var(--faint); line-height:1.3; margin-top:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }

  .log{
    font-family:Consolas,"Cascadia Mono","Courier New",monospace;
    font-size:12.5px; line-height:1.65;
    background:var(--glass-dark);
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:var(--radius-sm); padding:10px 12px;
    height:120px; max-height:120px; overflow-y:auto; white-space:pre-wrap; word-break:break-all;
    color:rgba(235,230,245,.88); border:1px solid rgba(255,255,255,.12);
  }
  .log .l-info{color:rgba(220,215,235,.75);} .log .l-ok{color:#7ddea8; font-weight:600;}
  .log .l-warn{color:#e8c070;} .log .l-err{color:#f09088;}
  .log .l-head{color:#64D2FF; font-weight:650;}
  .log-empty{color:rgba(235,235,245,.45); font-family:system-ui,sans-serif;}

  .rm-block{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);}
  .rm-title{font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:4px;}
  #remoteBox{max-height:120px; overflow-y:auto; min-height:0;}
  .rm-row{display:flex; gap:8px; align-items:flex-start; padding:5px 0;
          border-bottom:1px dashed var(--border);}
  .rm-row:last-child{border-bottom:none; padding-bottom:0;}
  .rm-tag{flex:0 0 64px; font-size:11.5px; font-weight:600; color:var(--muted); padding-top:1px;}
  .rm-tag.gh{color:#0071E3;} .rm-tag.gl{color:#b4622a;}
  .rm-body{flex:1; min-width:0;}
  .rm-sha{font-family:Consolas,"Cascadia Mono",monospace; font-size:12px;
          color:var(--text); font-weight:600; display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .rm-sub{font-size:11px; color:var(--muted); margin-top:1px; overflow:hidden;
          text-overflow:ellipsis; white-space:nowrap;}
  .rm-none{font-size:12.5px; color:var(--warn);}
  .rm-err{font-size:12px; color:var(--err); word-break:break-all; line-height:1.6;}
  .rm-empty{font-size:12.5px; color:var(--faint);}
  .rm-url{font-size:11px; color:var(--faint); font-family:Consolas,monospace;
          margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rm-alert{background:var(--err-soft); color:var(--err); border:1px solid rgba(209,74,66,.28);
            border-radius:10px; padding:6px 8px; font-size:12px; line-height:1.4;
            margin-bottom:6px;}
  .rm-badge{display:inline-block; font-size:11px; padding:1px 7px; border-radius:6px; font-weight:500;}
  .rm-badge.new{background:var(--warn-soft); color:var(--warn);}
  .rm-badge.same{background:var(--ok-soft); color:var(--ok);}
  .rm-badge.diff{background:var(--err-soft); color:var(--err);}
  .rm-badge.local{background:rgba(255,255,255,.4); color:var(--muted);}


  /* —— Compact push-first shell (fit laptop viewport, no page scroll) —— */
  .content{
    flex:1; min-width:0; min-height:0;
    display:flex; flex-direction:column;
    overflow:hidden; padding:0;
  }
  .page-scroll{
    flex:1; min-height:0; overflow:hidden; /* page itself does not scroll */
    padding:12px 14px 8px;
    display:flex; flex-direction:column;
  }
  .page-head{
    display:flex; align-items:flex-start; gap:10px;
    margin-bottom:8px; flex:0 0 auto;
  }
  .page-head h1{
    font-size:18px; font-weight:700; letter-spacing:-.02em;
    line-height:1.2; color:var(--text);
  }
  .page-sub{
    font-size:11.5px; color:var(--faint); margin-top:2px;
    font-family:Consolas,"Cascadia Mono",monospace;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    max-width:min(520px,65vw);
  }
  .page-head .spacer{flex:1;}
  .page-scroll > .tabs{margin-bottom:8px; flex:0 0 auto;}
  .page-scroll.is-config{overflow:hidden;}
  .page-scroll.is-config > .card{flex:1; min-height:0; display:flex; flex-direction:column;}
  .page-scroll.is-config > .card > .card-body{flex:1; min-height:0; overflow:hidden;}
  .page-scroll.is-push > .hero{flex:0 0 auto;}
  .page-scroll.is-validate > .card{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; margin-bottom:0;
  }
  .page-scroll.is-validate > .card > .card-body{
    flex:1; min-height:0; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .page-scroll.is-validate .rm-block{
    flex:1; min-height:0; display:flex; flex-direction:column;
  }
  .page-scroll.is-validate #remoteBox{flex:1 1 auto; min-height:120px; max-height:none; overflow-y:auto;}

  .hero{
    background:var(--glass-strong);
    backdrop-filter:var(--blur-strong); -webkit-backdrop-filter:var(--blur-strong);
    border:1px solid var(--hairline-strong);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:12px 14px;
    margin-bottom:8px;
    flex:0 0 auto;
  }
  .hero-top{
    display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;
  }
  .hero-top h2{font-size:13.5px; font-weight:650;}
  .hero-pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600;
    border:1px solid transparent;
  }
  .hero-pill.ok{background:var(--ok-soft); color:var(--ok); border-color:rgba(52,199,89,.28);}
  .hero-pill.warn{background:var(--warn-soft); color:var(--warn); border-color:rgba(255,159,10,.3);}
  .hero-pill.muted{background:rgba(0,0,0,.04); color:var(--muted); border-color:var(--hairline);}
  .hero-pill i{width:5px; height:5px; border-radius:50%; background:currentColor; display:block;}

  .btn.cta{
    padding:9px 22px; font-size:13.5px; font-weight:650;
    border-radius:12px; min-width:110px;
  }
  .hero .actions{margin-top:8px; padding-top:8px; flex-wrap:nowrap;}
  .hero-pull{
    margin-top:8px; padding-top:8px;
    border-top:1px dashed var(--border);
  }
  .hero-pull .pull-note{margin-top:4px;}

  /* validate status card can shrink; remote scrolls inside */
  .page-scroll > .card{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; margin-bottom:0;
  }
  .page-scroll > .card > .card-body{
    flex:1; min-height:0; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .page-scroll > .card .rm-block{
    flex:1; min-height:0; display:flex; flex-direction:column; margin-top:6px; padding-top:6px;
  }
  .page-scroll > .card #remoteBox{flex:1; max-height:120px;}

  /* Log: collapsed strip; expanded #log max 120px internal scroll */
  .log-bar{
    flex:0 0 auto;
    margin:0 10px 8px;
    background:var(--glass);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--hairline);
    border-radius:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .log-panel{display:none; flex-direction:column; min-height:0;}
  .log-bar.open .log-panel{display:flex;}
  .log-panel-tools{
    display:flex; align-items:center; gap:6px;
    padding:4px 10px; border-bottom:1px solid var(--hairline);
    font-size:11.5px; color:var(--muted);
  }
  .log-bar .log{
    height:120px; max-height:120px; border-radius:0; border:none;
    margin:0; background:var(--glass-dark);
  }
  .log-strip{
    display:flex; align-items:center; gap:6px;
    width:100%; padding:7px 12px;
    font-size:12px; color:var(--muted); text-align:left;
    transition:.14s; cursor:pointer;
  }
  .log-strip:hover{background:rgba(0,0,0,.03); color:var(--text);}
  .log-strip b{color:var(--text); font-weight:650; flex:0 0 auto;}
  .log-preview{
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:450; color:var(--muted);
    font-family:Consolas,"Cascadia Mono",monospace; font-size:12px;
  }
  .log-strip .chev{
    flex:0 0 auto; font-size:10px; color:var(--faint); transition:.18s;
  }
  .log-bar.open .log-strip{
    border-top:1px solid var(--hairline);
  }
  .log-bar.open .log-strip .chev{transform:rotate(180deg);}
  .log-dot{
    width:7px; height:7px; border-radius:50%; flex:0 0 auto;
    background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft);
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(29,29,31,.92); color:#fff; padding:11px 20px; border-radius:14px;
    font-size:13px; opacity:0; pointer-events:none; transition:.25s;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:var(--shadow-float); z-index:99;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.err{background:rgba(179,39,29,.9);} .toast.ok{background:rgba(22,111,67,.9);}

  .center-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; color:var(--faint); gap:14px; text-align:center;
  }
  .center-empty .ico{
    width:56px; height:56px; border-radius:16px;
    background:rgba(255,255,255,.4); border:1px solid var(--hairline);
    backdrop-filter:blur(12px);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }

  .modal-mask{
    position:fixed; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,.28);
    backdrop-filter:blur(10px) saturate(140%); -webkit-backdrop-filter:blur(10px) saturate(140%);
  }
  .modal{
    width:min(440px,100%);
    background:rgba(255,255,255,.72);
    backdrop-filter:var(--blur-strong); -webkit-backdrop-filter:var(--blur-strong);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-float);
    border:1px solid var(--hairline-strong);
    overflow:hidden;
  }
  .modal-h{padding:16px 18px 0; font-size:15px; font-weight:650;}
  .modal-b{padding:12px 18px 18px; font-size:13.5px; color:var(--muted); line-height:1.7;}
  .modal-b strong{color:var(--text); font-weight:650;}
  .modal-f{display:flex; justify-content:flex-end; gap:8px; padding:0 18px 16px;}
</style>
</head>

};

const TARGET_META = {
  github: {label:"GitHub",  short:"GH", sub:"github.com"},
  gitlab: {label:"GitLab",  short:"GL", sub:"自建 Git 服务"},
};

let LOG = [];
let _pendingPull = null; // {source}
let _pendingForce = null; // {maxBehind, labels}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg, kind){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast show"+(kind?" "+kind:"");
  clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2200);
}

/* ---------------- Ahead / Behind helpers ---------------- */
function abOf(remoteObj){
  if(!remoteObj || remoteObj.error) return {ahead:null, behind:null, exists:false};
  if(remoteObj.exists===false) return {ahead:null, behind:null, exists:false};
  const ahead = (typeof remoteObj.ahead==="number") ? remoteObj.ahead
              : (typeof remoteObj.ahead_count==="number") ? remoteObj.ahead_count : null;
  const behind = (typeof remoteObj.behind==="number") ? remoteObj.behind
               : (typeof remoteObj.behind_count==="number") ? remoteObj.behind_count : null;
  return {ahead, behind, exists: !!remoteObj.exists || !!remoteObj.sha};
}
function abText(ab){
  if(ab.ahead==null && ab.behind==null){
    return ab.exists ? "已连接" : "—";
  }
  const a = ab.ahead==null ? "?" : ab.ahead;
  const b = ab.behind==null ? "?" : ab.behind;
  return "Ahead "+a+" / Behind "+b;
}
function remoteBundle(i){
  const r = S.remote[i]||{};
  return {
    raw: r,
    local: r.local||{},
    github: r.github||{},
    gitlab: r.gitlab||{},
    branches: r.branches||{},
  };
}
function gateState(i){
  const bun = remoteBundle(i);
  const selected = [...S.targets];
  const notes = [];
  const blocked = [];
  let maxBehind = 0;

  if(!selected.length){
    return {
      canPush:false, blocked:[], notes:["请至少开启一个推送目标"],
      maxBehind:0, summaryTargets:"（未选择）", recommendPull:[]
    };
  }

  for(const t of ["github","gitlab"]){
    const ab = abOf(bun[t]);
    const label = TARGET_META[t].label;
    if(!S.targets.has(t)){
      if(typeof ab.behind==="number" && ab.behind>0){
        notes.push(label+" 未开启，Behind "+ab.behind+" 不拦本次推送");
      }
      continue;
    }
    if(typeof ab.behind==="number" && ab.behind>0){
      blocked.push({target:t, label, behind:ab.behind});
      if(ab.behind>maxBehind) maxBehind=ab.behind;
    }
  }

  const parts = selected.map(t=>{
    const ab=abOf(bun[t]);
    const bit = (ab.ahead!=null||ab.behind!=null)
      ? ("Ahead "+(ab.ahead??"?")+" / Behind "+(ab.behind??"?"))
      : "状态未知";
    return TARGET_META[t].label+(ab.behind>0?(" Behind "+ab.behind):"");
  });

  // recommend pull only for selected + behind
  const recommendPull = blocked.map(b=>b.target);

  return {
    canPush: blocked.length===0,
    blocked,
    notes,
    maxBehind,
    summaryTargets: parts.join(" + ") || "（未选择）",
    recommendPull,
  };
}

/* ---------------- 数据 ---------------- */
async function loadState(){
  try{
    const r=await fetch("/api/state"); const d=await r.json();
    S.repos=d.repos||[];
    S.git=d.git||{};
    renderGitBanner();
    if(S.selected<0 && S.repos.length) S.selected=0;
    renderList(); renderContent();
    S.repos.forEach((_,i)=>refreshStatus(i));
    if(S.selected>=0) validateNow(S.selected);
  }catch(e){ toast("加载失败："+e.message,"err"); }
}

function renderGitBanner(){
  const old=document.getElementById("gitBanner");
  if(old) old.remove();
  const g=S.git||{};
  if(g.available) return;
  const b=document.createElement("div");
  b.id="gitBanner";
  b.style.cssText="background:#fdecea;color:#d1382c;padding:10px 20px;font-size:13px;"+
                  "border-bottom:1px solid #f2cfcb;line-height:1.6";
  b.textContent="⚠ 找不到可用的 git 命令，推送和校验都无法工作。已尝试："+
                (g.exe||"git")+"　请安装 Git 后重新打开。";
  const app=document.querySelector(".app");
  app.insertBefore(b, document.querySelector("main"));
}

async function saveRepos(silent){
  try{
    const r=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({repos:S.repos})});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    S.dirty=false;
    if(!silent) toast("已保存","ok");
    renderList(); renderContent();
    return true;
  }catch(e){ toast("保存失败："+e.message,"err"); return false; }
}

async function refreshStatus(i){
  const repo=S.repos[i]; if(!repo) return;
  try{
    const r=await fetch("/api/validate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(repo)});
    S.status[i]=await r.json();
  }catch(e){ S.status[i]={exists:false,message:"校验失败"}; }
  updateStatusUi(i);
  renderList(); // refresh sidebar risk tags
  if(S.selected===i){
    paintValidate(S.status[i]);
    paintStatusTiles(i);
  }
}

function updateStatusUi(i){
  const el=document.querySelector('.repo[data-i="'+i+'"] .dot');
  if(!el) return;
  const st=S.status[i]||{};
  let cls="unk";
  if(st.exists && st.isGit && !(st.message||"").startsWith("本地无分支")) cls = st.dirty?"off":"on";
  else if(st.exists===false) cls="off";
  el.className="dot "+cls;
}

    if(typeof abGl.behind==="number" && abGl.behind>0)

function heroStatusPill(i,gate){
  const st=S.status[i]||{};
  if(gate.blocked.length){

    return `<span class="hero-pill warn"><i></i>Behind ${n}</span>`;
  }
  if(!S.targets.size){
    return `<span class="hero-pill muted"><i></i>未选目标</span>`;
  }
  if(st.exists && st.isGit && !st.dirty){
    return `<span class="hero-pill ok"><i></i>就绪</span>`;
  }
  if(st.dirty){
    return `<span class="hero-pill warn"><i></i>有改动</span>`;
  }
  if(st.exists===false || (st.exists && !st.isGit)){
    return `<span class="hero-pill warn"><i></i>待校验</span>`;
  }
  return `<span class="hero-pill muted"><i></i>就绪</span>`;
}

function renderStatusTiles(i){
  const bun=remoteBundle(i);
  const st=S.status[i]||{};
  const br=bun.branches||{};
  const localLabel = (!st.exists) ? "目录无效" : (!st.isGit ? "非 git" : (st.dirty?"有改动":"就绪"));
  const localCls = (!st.exists||!st.isGit) ? "err" : (st.dirty?"warn":(st.exists?"ok":""));
  function tile(key, title, obj, branch){
    const ab=abOf(obj);
    let cls="", v="—", s=esc(branch||"");
    if(S.remote[i] && S.remote[i].loading){ v="查询中…"; }
    else if(obj.error){ cls="err"; v="失败"; s=String(obj.error).slice(0,40); }
    else if(obj.exists===false){ cls="warn"; v="无此分支"; }
    else if(typeof ab.behind==="number" && ab.behind>0){ cls="warn"; v="Behind "+ab.behind; s="Ahead "+(ab.ahead??"?")+" · "+s; }
    else if(typeof ab.ahead==="number" || typeof ab.behind==="number"){ cls="ok"; v=abText(ab); }
    else if(obj.sha){ cls="ok"; v=obj.short||obj.sha.slice(0,7); }
    else { v="未校验"; }
    return `<div class="st-tile ${cls}"><div class="k">${title}</div><div class="v">${esc(v)}</div><div class="s">${s}</div></div>`;
  }
  const localBranch = (S.repos[i]&&S.repos[i].branch)||"main";
  return `
    <div class="st-tile ${localCls}"><div class="k">本地</div><div class="v">${esc(localLabel)}</div><div class="s">${esc(localBranch)}</div></div>
    ${tile("github","GitHub", bun.github, br.github|| (S.repos[i]&&(S.repos[i].github_branch||S.repos[i].branch)) || "main")}
    ${tile("gitlab","GitLab", bun.gitlab, br.gitlab|| (S.repos[i]&&(S.repos[i].gitlab_branch||S.repos[i].branch)) || "main")}
  `;
}

function paintStatusTiles(i){
  const el=document.getElementById("statusTiles");
  if(el) el.innerHTML=renderStatusTiles(i);
}

function paintGateUi(i){
  const gate=gateState(i);
  const repo=S.repos[i]||{};
  const branch=repo.branch||"main";
  const sum=document.getElementById("pushSummary");
  if(sum){
    sum.innerHTML = `<span class="muted">将推送：</span>${esc(gate.summaryTargets)} · ${esc(branch)}`
      + (gate.blocked.length
          ? ` · <span style="color:var(--warn)">Behind ${gate.maxBehind}</span>`
          : ` · <span style="color:var(--ok)">可推送</span>`);
  }
  const note=document.getElementById("gateNote");
  const pushBtn=document.getElementById("pushBtn");
  const forceLink=document.getElementById("forcePushLink");
  if(note){
    const lines=[];
    if(!S.targets.size) lines.push("未选择推送目标，推送已禁用");
    else if(gate.blocked.length){
      lines.push(gate.blocked.map(b=>b.label+" Behind "+b.behind).join("、")+"，请先拉取");
      gate.notes.forEach(n=>lines.push(n));
    } else {
      gate.notes.forEach(n=>lines.push(n));
      if(!lines.length) lines.push("已选目标可推送");
    }
    note.style.display="block";
    note.className="gate-note "+(!S.targets.size||gate.blocked.length?"warn": (gate.notes.length?"ok":"ok"));
    note.textContent=lines.join(" · ");
  }
  if(pushBtn){
    const disable = S.pushing || !S.targets.size || !gate.canPush;
    pushBtn.disabled = disable;
    if(!S.targets.size) pushBtn.title="请至少开启一个推送目标";
    else if(!gate.canPush) pushBtn.title=gate.blocked.map(b=>b.label+" Behind "+b.behind).join("、")+"，请先拉取";
    else pushBtn.title="";
  }
  if(forceLink){
    forceLink.style.display = (gate.blocked.length && S.targets.size) ? "inline-flex" : "none";
  }
  // recommend pull: highlight selected+behind in pull card; elevate one rec button beside push
  const rec=gate.recommendPull||[];
  const recSet=new Set(rec);
  [["pullGh","github"],["pullGl","gitlab"]].forEach(([id,t])=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.className = recSet.has(t) ? "btn primary" : "btn";
  });
  const recBtn=document.getElementById("recPullBtn");
  if(recBtn){
    if(rec.length===1){
      window._recPullSource=rec[0];
      recBtn.style.display="inline-flex";
      recBtn.textContent="从 "+TARGET_META[rec[0]].label+" 拉取";
      recBtn.className="btn primary";
    } else if(rec.length>1){
      // multiple behind: leave card buttons as primary; hide single elev button
      recBtn.style.display="none";
      window._recPullSource=null;
    } else {
      recBtn.style.display="none";
      window._recPullSource=null;
    }
  }
}

/* ---------------- URL warn ---------------- */
function normUrl(u){
  if(!u) return "";
  let s=String(u).trim().toLowerCase().replace(/\\/g,"/");
  s=s.replace(/\/+$/,"").replace(/\.git$/,"");
  s=s.replace(/^(https?|ssh|git):\/\//,"");
  const seg=s.split("/");
  if(seg[0] && seg[0].indexOf("@")>=0) s=s.slice(seg[0].indexOf("@")+1);
  if(s.indexOf("/")<0 && s.indexOf(":")>=0) s=s.replace(":","/");
  return s.replace(/\/+$/,"");
}
function updateUrlWarn(){
  const box=document.getElementById("urlWarnBox");
  if(!box) return;
  const r=S.repos[S.selected];
  if(!r){ box.innerHTML=""; return; }
  const a=normUrl(r.github), b=normUrl(r.gitlab);
  box.innerHTML = (a && b && a===b)
    ? '<div class="rm-alert" style="margin:0">⚠ <b>GitHub 和 GitLab 填的是同一个地址</b>，两边指向同一个仓库。'
      + '请改掉其中一个，否则推送会把代码推两遍到同一个地方，真正的 GitLab 收不到东西。</div>'
    : '';
}

/* ---------------- 编辑 ---------------- */
function edit(i,key,val){ S.repos[i][key]=val; S.dirty=true; syncSaveBtn(); onFieldChange(); }
function editOpt(i,key,val){
  if(val.trim()) S.repos[i][key]=val.trim(); else delete S.repos[i][key];
  S.dirty=true; syncSaveBtn(); onFieldChange();
}
function onFieldChange(){
  const r=S.repos[S.selected];
  const ghb=document.getElementById("f_ghb"), glb=document.getElementById("f_glb");
  const local=(r&&r.branch)||"main";
  if(ghb) ghb.placeholder=local;
  if(glb) glb.placeholder=local;
  const itemName=document.querySelector('.repo[data-i="'+S.selected+'"] .repo-name');
  if(itemName && r) itemName.innerHTML='<span class="dot '+(itemName.querySelector('.dot')?.className.split(" ")[1]||"unk")+'"></span>'+esc(r.name||"未命名");
  const tags=document.querySelectorAll('.repo[data-i="'+S.selected+'"] .tag');
  // first two are GH/GL branch tags; risk tags follow
  if(tags.length>=2 && r){
    tags[0].textContent="GH "+(r.github_branch||local);
    tags[1].textContent="GL "+(r.gitlab_branch||local);
  }
  updateUrlWarn();
  renderDirtyHint();
}
function syncSaveBtn(){
  const btn=document.getElementById("saveBtn") || [...document.querySelectorAll("#content .actions .btn")].find(b=>b.textContent.trim()==="保存");
  if(btn) btn.disabled=!S.dirty;
  renderDirtyHint();
}
function renderDirtyHint(){
  const head=document.getElementById("configHead");
  if(!head) return;
  let h=head.querySelector(".dirtyhint");
  if(S.dirty){
    if(!h){
      h=document.createElement("span"); h.className="dirtyhint"; h.textContent="未保存";
      const sp=head.querySelector(".spacer");
      head.insertBefore(h, sp||head.firstChild.nextSibling);
    }
  } else if(h){ h.remove(); }
}

/* ---------------- 目标 toggles ---------------- */
function toggleTarget(t,on){
  if(on) S.targets.add(t); else S.targets.delete(t);
  // allow both off (gate disables push)
  if(S.tab==="push") renderContent();
}

/* ---------------- 仓库增删 ---------------- */
function addRepo(){
  S.repos.push({name:"新仓库", path:"", github:"", gitlab:"", branch:"main"});
  S.selected=S.repos.length-1; S.dirty=true; S.tab="config";
  renderList(); renderContent();
  setTimeout(()=>{const el=document.getElementById("f_path"); if(el) el.focus();},30);
}
function delRepo(i){
  if(!confirm("确定删除「"+((S.repos[i]||{}).name||"未命名")+"」？\n（只从清单移除，不动你的代码）")) return;
  S.repos.splice(i,1);
  S.selected = S.repos.length? Math.min(i, S.repos.length-1) : -1;
  S.dirty=true;
  saveRepos(true).then(()=>{
    S.status={}; S.remote={};
    S.repos.forEach((_,k)=>refreshStatus(k));
    updateAllBtn(); toast("已移除","ok");
  });
}

/* ---------------- 校验 ---------------- */
function paintValidate(st){
  const el=document.getElementById("valStrip"); if(!el) return;
  let cls="", txt="";
  if(!st){ return; }
  if(st.gitMissing){ cls="err"; txt="✖ "+st.message; }
  else if(!st.exists){ cls="err"; txt="✖ 目录不存在"; }
  else if(!st.isGit){ cls="err"; txt="✖ 不是 git 仓库（缺 .git）"; }
  else if(st.message && st.message.startsWith("本地无分支")){ cls="err"; txt="✖ "+st.message; }
  else { cls=st.dirty?"warn":"ok"; txt=(st.dirty?"⚠ ":"✔ ")+st.message; }
  el.className="validate-strip "+cls; el.textContent=txt;
}

function renderRemote(i){
  const r=S.remote[i];
  if(!r) return '<div class="rm-empty">还没校验。进入本页会自动校验。</div>';
  if(r.loading) return '<div class="rm-empty">查询中…（需要访问远端，约几秒）</div>';
  if(!r.ok && r.error) return '<div class="rm-err">✖ '+esc(r.error)+'</div>';

  const br=r.branches||{};
  const l=r.local||{}, g=r.github||{}, b=r.gitlab||{};

  function badge(x, remote){
    if(x.error || !x.exists) return '';
    if(typeof x.behind==="number" || typeof x.ahead==="number"){
      const same = (x.behind===0 && x.ahead===0);
      return '<span class="rm-badge '+(same?'same':'diff')+'">Ahead '+(x.ahead??"?")+' / Behind '+(x.behind??"?")+'</span>';
    }
    const same = l.sha && x.sha && l.sha===x.sha;
    return '<span class="rm-badge '+(same?'same':'diff')+'">'+(same?'与本地一致':'与本地不同')+'</span>';
  }
  function line(tag, cls, branch, x, remote){
    let body;
    if(x.error){
      body='<div class="rm-err">✖ '+esc(x.error)+'</div>';
    } else if(!x.exists){
      body='<div class="rm-none">无此分支'+(remote!=='local'?'（推送时将新建）':'')+'</div>';
    } else {
      body='<div class="rm-sha">'+esc(x.short||'')+badge(x,remote)+'</div>';
      if(x.subject) body+='<div class="rm-sub">'+esc(x.subject)+(x.date?'　·　'+esc(x.date):'')+'</div>';
      else if(remote!=='local') body+='<div class="rm-sub">（本地无该提交对象，只显示 SHA）</div>';
    }
    if(remote!=='local' && x.url) body+='<div class="rm-url" title="'+esc(x.url)+'">'+esc(x.url)+'</div>';
    return '<div class="rm-row"><div class="rm-tag '+cls+'">'+tag
         + '<br><span style="font-weight:400;font-size:11px">'+esc(branch||'')+'</span></div>'
         + '<div class="rm-body">'+body+'</div></div>';
  }
  const alert = r.sameRemote
    ? '<div class="rm-alert">⚠ <b>GitHub 与 GitLab 填的是同一个地址</b>，两边其实指向同一个仓库。'
      + '这样推送会把代码推两遍到同一个地方，真正的 GitLab 收不到东西，还会误报成功。'
      + '请到「配置」把 GitLab 地址改正。</div>'
    : '';
  return alert
       + line('本地','',br.local,l,'local')
       + line('GitHub','gh',br.github,g,'github')
       + line('GitLab','gl',br.gitlab,b,'gitlab');
}

async function checkRemote(i){
  const repo=S.repos[i]; if(!repo) return;
  S.remote[i]={loading:true};
  let box=document.getElementById("remoteBox");
  if(box) box.innerHTML=renderRemote(i);
  paintStatusTiles(i);
  try{
    const resp=await fetch("/api/remote-status",{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(repo)});
    S.remote[i]=await resp.json();
  }catch(e){
    S.remote[i]={ok:false, error:"通信失败："+e.message};
  }
  renderList();
  if(S.selected===i){
    box=document.getElementById("remoteBox");
    if(box) box.innerHTML=renderRemote(i);
    paintStatusTiles(i);
    paintGateUi(i);
    // refresh toggle card ahead/behind labels + hero pill via gate
    ["github","gitlab"].forEach(t=>{
      const card=document.getElementById("tg_"+t);
      if(!card) return;
      const ab=abOf((S.remote[i]||{})[t]||{});
      const span=card.querySelector(".tg-body span");
      if(span) span.textContent=abText(ab);
      const on=S.targets.has(t);
      const warn=on && typeof ab.behind==="number" && ab.behind>0;
      card.className="tg-card "+(on?"on ":"")+(warn?"warn":"");
    });
    // refresh hero status pill text if present
    const heroTop=document.querySelector(".hero-top");
    if(heroTop){
      const gate=gateState(i);
      const pill=heroTop.querySelector(".hero-pill");
      if(pill){
        const tmp=document.createElement("div");
        tmp.innerHTML=heroStatusPill(i,gate);
        pill.replaceWith(tmp.firstElementChild);
      }
    }
  }
}

async function validateNow(i){
  const el=document.getElementById("valStrip");
  if(el){ el.className="validate-strip"; el.textContent="校验中…"; }
  await refreshStatus(i);
  if(S.selected===i) paintValidate(S.status[i]);
  updateStatusUi(i);
  await checkRemote(i);
}

async function openDir(i){
  const r=S.repos[i]; if(!r.path) return toast("还没填路径","err");
  const resp=await fetch("/api/open",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path:r.path})});
  const d=await resp.json();
  if(d.error) toast(d.error,"err");
}

/* ---------------- Modals ---------------- */
function closeModal(){
  const host=document.getElementById("modalHost");
  if(host) host.innerHTML="";
  _pendingPull=null; _pendingForce=null;
}
function showModal({title, bodyHtml, actions}){
  const host=document.getElementById("modalHost");
  host.innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog">
      <div class="modal-h">${esc(title)}</div>
      <div class="modal-b">${bodyHtml}</div>
      <div class="modal-f">${actions}</div>
    </div>
  </div>`;
}

function askPull(source){
  if(S.pushing) return;
  const repo=S.repos[S.selected]||{};
  const label=source==="github"?"GitHub":"GitLab";
  const url=source==="github"?repo.github:repo.gitlab;
  if(!url){ toast("这个仓库还没填 "+label+" 地址","err"); return; }
  const branch=repo.branch||"main";
  _pendingPull={source};
  showModal({
    title:"确认拉取",
    bodyHtml:`将从 <strong>${esc(label)}</strong> 拉取到本地分支 <strong>${esc(branch)}</strong>。<br>请确认目标平台无误。`,
    actions:`<button class="btn" onclick="closeModal()">取消</button>
             <button class="btn primary" onclick="confirmPull()">确认拉取</button>`
  });
}
function confirmPull(){
  const p=_pendingPull; closeModal();
  if(p) doPull(p.source);
}

function askForcePush(){
  if(S.pushing) return;
  const i=S.selected;
  const gate=gateState(i);
  if(!gate.blocked.length){ doPush(); return; }
  const n=gate.maxBehind||gate.blocked[0].behind||0;
  const labels=gate.blocked.map(b=>b.label).join("、");
  _pendingForce={maxBehind:n, labels};
  showModal({
    title:"仍要推送？",
    bodyHtml:`远端 Behind <strong>${n}</strong>（${esc(labels)}），非快进推送会被拒绝；若强制推送将覆盖远端提交。`,
    actions:`<button class="btn" onclick="closeModal()">取消</button>
             <button class="btn danger" onclick="confirmForcePush()">仍要推送</button>`
  });
}
function confirmForcePush(){
  closeModal();
  doPush({force:true});
}

/* ---------------- 推送 ---------------- */
function appendLog(level,text){
  LOG.push({level, text});
  const log=document.getElementById("log");
  if(log){
    if(log.querySelector(".log-empty")) log.innerHTML="";
    const div=document.createElement("div");
    div.className="l-"+level;
    div.textContent=text===""?" ":text;
    log.appendChild(div);
    log.scrollTop=log.scrollHeight;
  }
  paintLogPreview();
}
function clearLog(){
  LOG=[];
  const l=document.getElementById("log");
  if(l) l.innerHTML='<span class="log-empty">推送与拉取结果会显示在这里…</span>';
  paintLogPreview();
}

async function doPush(opts){
  if(S.pushing) return;
  const force=!!(opts&&opts.force);
  if(!force){
    const gate=gateState(S.selected);
    if(!S.targets.size){ toast("请至少选一个推送目标","err"); return; }
    if(!gate.canPush){ toast("已选目标存在 Behind，请先拉取或点「仍要推送…」","err"); return; }
  }
  if(S.dirty){ const ok=await saveRepos(true); if(!ok) return; }
  const idxs=selectedIndexes();
  if(!idxs.length){ toast("请先在左边选一个仓库","err"); return; }
  if(!S.targets.size){ toast("请至少选一个推送目标","err"); return; }

  S.pushing=true; clearLog();
  const btn=document.getElementById("pushBtn");
  if(btn){ btn.disabled=true; btn.textContent=force?"强制推送中…":"推送中…"; }
  appendLog("info","→ "+idxs.length+" 个仓库："+[...S.targets].map(t=>TARGET_META[t].label).join(" + ")+(force?"（强制）":""));

  try{
    const body={indexes:idxs, targets:[...S.targets], checkOnly:false};
    if(force) body.force=true;
    const resp=await fetch("/api/push",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)});
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n"); buf=lines.pop();
      for(const ln of lines){
        if(!ln.trim()) continue;
        let o; try{ o=JSON.parse(ln); }catch(e){ continue; }
        if(o.done){ appendLog(o.ok?"ok":"err", o.ok?"—— 全部完成 ✔":"—— 存在失败项 ✖");
          toast(o.ok?"推送完成":"有失败项", o.ok?"ok":"err"); break; }
        appendLog(o.level||"info", o.text);
      }
    }
  }catch(e){ appendLog("err","✖ 通信失败："+e.message); toast("推送失败","err"); }
  finally{
    S.pushing=false;
    if(btn){ btn.disabled=false; btn.textContent="推送"; }
    paintGateUi(S.selected);
    idxs.forEach(i=>{ delete S.status[i]; refreshStatus(i); checkRemote(i); });
  }
}

/* ---------------- 拉取 ---------------- */
async function doPull(source){
  if(S.pushing) return;
  if(S.dirty){ const ok=await saveRepos(true); if(!ok) return; }
  const idxs=selectedIndexes();
  if(!idxs.length){ toast("请先在左边选一个仓库","err"); return; }

  const repo=S.repos[S.selected]||{};
  const label=source==="github"?"GitHub":"GitLab";
  const url=source==="github"?repo.github:repo.gitlab;
  if(!url){ toast("这个仓库还没填 "+label+" 地址","err"); return; }

  const force=!!window._force;
  if(force && !confirm("强制覆盖本地？\n\n会丢弃本地未提交的改动、以及本地领先的提交，\n以远端版本为准。此操作不可撤销。")) return;

  S.pushing=true; clearLog();
  const btns=[document.getElementById(source==="github"?"pullGh":"pullGl"),
              document.getElementById("recPullBtn")].filter(Boolean);
  const oldTxts=btns.map(b=>b.textContent);
  btns.forEach(b=>{ b.disabled=true; b.textContent="拉取中…"; });
  appendLog("info","← 从 "+label+" 拉取到本地"+(force?"（强制覆盖）":""));

  try{
    const resp=await fetch("/api/pull",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({indexes:idxs, source:source, force:force})});
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n"); buf=lines.pop();
      for(const ln of lines){
        if(!ln.trim()) continue;
        let o; try{ o=JSON.parse(ln); }catch(e){ continue; }
        if(o.done){
          appendLog(o.ok?"ok":"err", o.ok?"—— 拉取完成 ✔":"—— 拉取失败 ✖");
          toast(o.ok?"拉取完成":"拉取失败", o.ok?"ok":"err");
          break;
        }
        appendLog(o.level||"info", o.text);
      }
    }
  }catch(e){
    appendLog("err","✖ 通信失败："+e.message); toast("拉取失败","err");
  }finally{
    S.pushing=false;
    btns.forEach((b,idx)=>{ b.disabled=false; b.textContent=oldTxts[idx]; });
    if(S.selected>=0){ delete S.status[S.selected]; refreshStatus(S.selected); checkRemote(S.selected); }
  }
}

/* ---------------- 服务 ---------------- */
async function shutdown(){
  if(!confirm("关闭 Git-Sync 服务？\n（界面会失效，下次双击启动器即可再次打开）")) return;
  try{ await fetch("/api/shutdown",{method:"POST"}); }catch(e){}
  document.body.innerHTML='<div style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#6b7a8d;font-family:system-ui"><div style="font-size:40px">✓</div><div>服务已关闭，可以关掉这个页面了</div></div>';
}

    document.querySelector(".app").classList.add("side-collapsed");

}catch(e){}
syncSideToggle();

loadState();
